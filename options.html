<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <header>
    <h1>Rose Colored Glasses</h1>
    <p class="tagline">Options</p>
  </header>

  <main>
    <div class="field sites">
      <span class="label">Sites you added</span>
      <ul id="siteList" class="site-list"></ul>
      <p id="sitesEmpty" class="hint" hidden>
        None yet. Open the popup on any https news site and click
        "Enable on this site."
      </p>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
  </main>

  <script src="options.js"></script>
</body>
</html>
